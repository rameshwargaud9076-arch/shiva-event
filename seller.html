    <!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Panel</title>

<style>
body{
    font-family:Arial;
    background:linear-gradient(135deg,#111,#1f1f1f);
    color:white;
    text-align:center;
    padding:20px;
}

.panel{
    max-width:500px;
    margin:auto;
    background:rgba(255,255,255,0.08);
    padding:20px;
    border-radius:15px;
}

input,select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    border:none;
}

button{
    padding:10px 15px;
    background:orange;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.card{
    background:white;
    color:black;
    margin:10px;
    padding:10px;
    border-radius:10px;
    width:220px;
}

img{width:100%;height:150px;object-fit:cover;}
#list{display:flex;flex-wrap:wrap;justify-content:center;}
</style>
</head>

<body>

<h1>Seller Panel 🏪</h1>

<div class="panel">
<input id="name" placeholder="Name">
<input id="price" type="number" placeholder="Price">

<select id="category">
<option>Jaymal Stage</option>
<option>Balloon Decoration</option>
<option>Haldi Decoration</option>
<option>Mehndi Setup</option>
<option>Wedding Stage</option>
<option>DJ Setup</option>
<option>Photography Setup</option>
</select>

<input type="file" id="image">
<button onclick="add()">Add Product</button>
</div>

<div id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDZR-nmPJp_euygcupVBGk41-3sVUxf-YQ",
authDomain: "shiva-event.firebaseapp.com",
projectId: "shiva-event",
storageBucket: "shiva-event.appspot.com",
messagingSenderId: "256536122488",
appId: "1:256536122488:web:d42712bc049755c537498d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function add(){

let n = document.getElementById("name").value;
let p = document.getElementById("price").value;
let c = document.getElementById("category").value;
let file = document.getElementById("image").files[0];

if(!n || !p || !file){
alert("Fill all fields");
return;
}

let reader = new FileReader();

reader.onload = async function(e){

await addDoc(collection(db,"products"),{
name:n,
price:p,
category:c,
image:e.target.result
});

alert("Uploaded ✅");
show();
};

reader.readAsDataURL(file);
}

window.add = add;

async function show(){

let list = document.getElementById("list");
list.innerHTML="";

let snap = await getDocs(collection(db,"products"));

snap.forEach((d)=>{

let p = d.data();

list.innerHTML += `
<div class="card">
<img src="${p.image}">
<h3>${p.name}</h3>
<p>${p.category}</p>
<h2>₹${p.price}</h2>
<button onclick="del('${d.id}')">Delete</button>
</div>
`;
});
}

window.del = async function(id){
await deleteDoc(doc(db,"products",id));
show();
}

show();

</script>

</body>
</html>
