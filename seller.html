<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Panel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            background: linear-gradient(135deg, #111, #1f1f1f);
            color: white;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            color: orange;
        }

        .panel {
            max-width: 500px;
            margin: auto;
            background: rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 20px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: orange;
            font-weight: bold;
            cursor: pointer;
        }

        #list {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            width: 220px;
            background: white;
            color: black;
            border-radius: 15px;
            overflow: hidden;
            padding-bottom: 15px;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .delete-btn {
            background: red;
            color: white;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>Seller Panel 🏪</h1>

    <div class="panel">

        <input id="name" placeholder="Decoration Name">

        <input id="price" type="number" placeholder="Price">

        <select id="category">
            <option>Jaymal Stage</option>
            <option>Balloon Decoration</option>
            <option>Haldi Decoration</option>
            <option>Mehndi Setup</option>
            <option>Birthday Decoration</option>
            <option>Anniversary Decoration</option>
            <option>Wedding Stage</option>
            <option>Car Decoration</option>
            <option>Entry Gate Decoration</option>
            <option>Mandap Decoration</option>
            <option>Flower Decoration</option>
            <option>Room Decoration</option>
            <option>Baby Shower Decoration</option>
            <option>LED Light Decoration</option>
            <option>DJ Setup</option>
            <option>Photography Setup</option>
            <option>Catering Setup</option>
            <option>Selfie Point</option>
        </select>

        <input type="file" id="image">

        <button onclick="add()">Add Product</button>

    </div>

    <div id="list"></div>

    <script>

        function add() {

            let n = document.getElementById("name").value.trim();
            let p = document.getElementById("price").value.trim();
            let c = document.getElementById("category").value;
            let file = document.getElementById("image").files[0];

            if (!n || !p || !file) {
                alert("Sab fill karo!");
                return;
            }

            let reader = new FileReader();

            reader.onload = function (e) {

                let img = new Image();
                img.src = e.target.result;

                img.onload = function () {

                    let canvas = document.createElement("canvas");
                    let ctx = canvas.getContext("2d");

                    canvas.width = 300;
                    canvas.height = 300;

                    ctx.drawImage(img, 0, 0, 300, 300);

                    let smallImage = canvas.toDataURL("image/jpeg", 0.5);

                    let products = JSON.parse(localStorage.getItem("products")) || [];

                    products.push({
                        name: n,
                        price: p,
                        category: c,
                        image: smallImage
                    });

                    localStorage.setItem("products", JSON.stringify(products));

                    alert("Product Added ✅");

                    document.getElementById("name").value = "";
                    document.getElementById("price").value = "";
                    document.getElementById("image").value = "";

                    show();
                }
            }

            reader.readAsDataURL(file);
        }

        function show() {

            let products = JSON.parse(localStorage.getItem("products")) || [];

            let list = document.getElementById("list");

            list.innerHTML = "";

            products.forEach((p, i) => {

                list.innerHTML += `
                <div class="card">
                    <img src="${p.image}">
                    <h3>${p.name}</h3>
                    <p>${p.category}</p>
                    <h2>₹${p.price}</h2>
                    <button class="delete-btn" onclick="del(${i})">Delete</button>
                </div>`;
            });
        }

        function del(i) {

            let products = JSON.parse(localStorage.getItem("products"));

            products.splice(i, 1);

            localStorage.setItem("products", JSON.stringify(products));

            show();
        }

        show();

    </script>

</body>

</html>
