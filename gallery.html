<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer</title>

<style>
body{
font-family:Arial;
background:url("custumar.png") center/cover fixed;
color:white;
text-align:center;
}

body::before{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
z-index:-1;
}

h1{font-size:40px;}

.cat{
display:inline-block;
margin:8px;
padding:12px 15px;
background:linear-gradient(45deg,orange,deeppink);
border-radius:10px;
cursor:pointer;
}

#products{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
margin-top:20px;
}

.card{
background:white;
color:black;
width:200px;
border-radius:10px;
overflow:hidden;
cursor:pointer;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
color:black;
padding:20px;
display:none;
border-radius:10px;
width:300px;
}
</style>
</head>

<body>

<h1>SHIVA EVENT</h1>

<!-- CATEGORY FIXED -->
<div class="cat" onclick="load('Jaymal Stage')">Jaymal Stage</div>
<div class="cat" onclick="load('Balloon Decoration')">Balloon Decoration</div>
<div class="cat" onclick="load('Haldi Decoration')">Haldi Decoration</div>
<div class="cat" onclick="load('Mehndi Setup')">Mehndi Setup</div>
<div class="cat" onclick="load('Wedding Stage')">Wedding Stage</div>
<div class="cat" onclick="load('DJ Setup')">DJ Setup</div>
<div class="cat" onclick="load('Photography Setup')">Photography</div>

<div id="products"></div>

<div id="popup"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDZR-nmPJp_euygcupVBGk41-3sVUxf-YQ",
authDomain: "shiva-event.firebaseapp.com",
projectId: "shiva-event",
storageBucket: "shiva-event.appspot.com",
messagingSenderId: "256536122488",
appId: "1:256536122488:web:d42712bc049755c537498d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allProducts = [];
let selected = null;

async function load(cat){

let snap = await getDocs(collection(db,"products"));

allProducts = [];
let box = document.getElementById("products");
box.innerHTML = "";

snap.forEach(d=>{
let p = d.data();
p.id = d.id;
allProducts.push(p);

if(p.category === cat){

box.innerHTML += `
<div class="card" onclick="openP('${p.id}')">
<img src="${p.image}">
<h3>${p.name}</h3>
<p>₹${p.price}</p>
</div>
`;
}
});
}

window.load = load;

window.openP = function(id){

selected = allProducts.find(p=>p.id===id);

document.getElementById("popup").style.display="block";

document.getElementById("popup").innerHTML=`
<h2>${selected.name}</h2>
<p>₹${selected.price}</p>

<textarea id="addr" placeholder="Address"></textarea>

<br><br>

<button onclick="book()">Book Now</button>
<button onclick="closeP()">Close</button>
`;
}

window.book = function(){

let a = document.getElementById("addr").value;

if(!a){
alert("Address daal");
return;
}

let msg = `SHIVA EVENT BOOKING\n\n${selected.name}\n₹${selected.price}\n${a}`;

window.open("https://wa.me/919076792223?text="+encodeURIComponent(msg));
}

window.closeP = function(){
document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
