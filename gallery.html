<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer</title>

<style>
body{
font-family:Arial;
background:url("custumar.png") center/cover fixed;
color:white;
text-align:center;
}

body::before{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
z-index:-1;
}

.cat{
display:inline-block;
margin:10px;
padding:15px;
background:linear-gradient(45deg,orange,deeppink);
border-radius:10px;
cursor:pointer;
}

.card{
background:white;
color:black;
margin:10px;
padding:10px;
border-radius:10px;
width:200px;
display:inline-block;
}

img{width:100%;height:150px;object-fit:cover;}

.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
color:black;
padding:20px;
display:none;
border-radius:10px;
}
</style>
</head>

<body>

<h1>SHIVA EVENT</h1>

<div class="cat" onclick="loadCat('Wedding Stage')">Wedding</div>
<div class="cat" onclick="loadCat('Balloon Decoration')">Balloon</div>
<div class="cat" onclick="loadCat('DJ Setup')">DJ</div>
<div class="cat" onclick="loadCat('Haldi Decoration')">Haldi</div>

<div id="products"></div>

<div id="popup"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDZR-nmPJp_euygcupVBGk41-3sVUxf-YQ",
authDomain: "shiva-event.firebaseapp.com",
projectId: "shiva-event",
storageBucket: "shiva-event.appspot.com",
messagingSenderId: "256536122488",
appId: "1:256536122488:web:d42712bc049755c537498d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allProducts = [];
let selected = null;

window.loadCat = async function(cat){

let products = document.getElementById("products");
products.innerHTML = "";

let snap = await getDocs(collection(db,"products"));

allProducts = [];

snap.forEach(d=>{

let p = d.data();
allProducts.push(p);

if(p.category.trim().toLowerCase() === cat.trim().toLowerCase()){

products.innerHTML += `
<div class="card" onclick='openPopup(${JSON.stringify(p)})'>
<img src="${p.image}">
<h3>${p.name}</h3>
<p>₹${p.price}</p>
</div>
`;
}

});
}

window.openPopup = function(p){

selected = p;

document.getElementById("popup").style.display="block";

document.getElementById("popup").innerHTML=`
<h2>${p.name}</h2>
<p>₹${p.price}</p>

<textarea id="addr" placeholder="Enter Address"></textarea>

<br><br>

<button onclick="bookNow()">Book Now</button>
<button onclick="closePopup()">Close</button>
`;
}

window.bookNow = function(){

let a = document.getElementById("addr").value;

if(!a){
alert("Address enter karo");
return;
}

let msg = `SHIVA EVENT BOOKING\n${selected.name}\n₹${selected.price}\n${a}`;

window.open("https://wa.me/919076792223?text="+encodeURIComponent(msg));
}

window.closePopup = function(){
document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
